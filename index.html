<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมัคร / ติดต่อ</title>

<style>
/* ===== พื้นฐาน ===== */
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  color:#fff;
  background:
    linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
    url('bg.jpg') center/cover no-repeat fixed;
}

.wrap{
  max-width:520px;
  margin:0 auto;
  padding:20px 14px 40px;
}

/* ===== การ์ด ===== */
.card{
  background:#141414;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #222;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}

/* ===== รูปบน ===== */
.hero img{
  width:100%;
  display:block;
  aspect-ratio:4/5;
  object-fit:cover;
}

/* ===== เนื้อหา ===== */
.content{
  padding:16px;
}

.title{
  font-size:18px;
  font-weight:700;
  margin:0 0 8px;
}

.sub{
  font-size:14px;
  opacity:.85;
}

/* ===== ปุ่ม ===== */
.btns{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:16px;
}

.btn{
  padding:14px;
  border-radius:14px;
  font-size:16px;
  font-weight:700;
  text-align:center;
  text-decoration:none;
}

.btn-main{
  background:#25D366;
  color:#111;
}

.footer{
  font-size:12px;
  opacity:.6;
  text-align:center;
  margin-top:12px;
}

/* ===== รูปเลื่อนลง ===== */
.gallery{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.gallery img{
  width:100%;
  border-radius:14px;
  object-fit:cover;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <!-- รูปหลัก -->
    <div class="hero">
      <img src="banner1.jpg" alt="สมัครงาน">
    </div>

    <!-- เนื้อหา -->
    <div class="content">
      <p class="title">สมัครง่าย ไม่ซับซ้อน</p>
      <p class="sub">ดูรายละเอียดด้านล่าง แล้วกดสมัครได้ทันที</p>

      <div class="btns">
        <a class="btn btn-main"
           href="https://wa.me/8562098807205"
           target="_blank">
          สมัครเลย ฟรี!!
        </a>
      </div>

      <div class="footer">* กดเพื่อเปิด WhatsApp</div>
    </div>

  </div>

  <!-- รูปเลื่อนลง -->
  <div class="gallery">
    <img src="gallery1.jpg">
    <img src="gallery2.jpg">
    <img src="gallery3.jpg">
  </div>

</div>

</body>
</html>
