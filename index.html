<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>สมัคร / ติดต่อ</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto; background:#0b0b0b; color:#fff;}
    .wrap{max-width:520px;margin:0 auto; padding:16px;}
    .card{background:#141414;border-radius:18px; overflow:hidden; border:1px solid #222;}

    /* ===== Slider ===== */
    .slider{position:relative; width:100%; overflow:hidden; background:#000;}
    .slide{
      width:100%;
      display:none;
      aspect-ratio: 4 / 5;   /* ปรับให้เหมาะกับงานแอด (อยากเปลี่ยนได้) */
      object-fit: cover;
    }
    .slide.active{display:block;}

    .content{padding:16px;}
    .title{font-size:18px; font-weight:700; line-height:1.3; margin:0 0 10px;}
    .sub{opacity:.85; margin:0 0 14px; font-size:14px;}
    .btns{display:flex; flex-direction:column; gap:10px; margin-top:10px;}
    .btn{
      display:flex; align-items:center; justify-content:center;
      padding:14px 16px; border-radius:14px; text-decoration:none;
      font-weight:700; font-size:16px; border:1px solid transparent;
    }
    .btn-admin{background:#ffffff; color:#111;}
    .btn-hr{background:#25D366; color:#111;} /* โทน WhatsApp */
    .footer{opacity:.65; font-size:12px; margin-top:14px; text-align:center;}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <!-- รูปสไลด์ -->
      <div class="slider" id="slider">
        <img src="banner1.jpg" class="slide active" alt="banner 1">
        <img src="banner2.jpg" class="slide" alt="banner 2">
        <img src="banner3.jpg" class="slide" alt="banner 3">
      </div>

      <div class="content">
        <p class="title">สนใจสมัคร / สอบถามรายละเอียด</p>
        <p class="sub">กดปุ่มด้านล่างเพื่อคุยกับแอดมินได้ทันที</p>

        <div class="btns">
          <a class="btn btn-admin" href="https://wa.me/8562099810013" target="_blank" rel="noopener">
            สมัครสมาชิก
          </a>

          <a class="btn btn-hr" href="https://wa.me/8562092311002" target="_blank" rel="noopener">
            ติดต่อแอดมิน
          </a>
        </div>

      
      </div>
    </div>
  </div>

  <script>
    (function () {
      const slides = document.querySelectorAll('.slide');
      if (!slides || slides.length === 0) return;

      let index = 0;
      const intervalMs = 3000; 

      setInterval(() => {
        slides[index].classList.remove('active');
        index = (index + 1) % slides.length;
        slides[index].classList.add('active');
      }, intervalMs);
    })();
  </script>
</body>
</html>
